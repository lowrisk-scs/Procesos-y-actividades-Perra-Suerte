<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style>
<title>Procesos Perra Suerte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("ps-tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: una mesa de trabajo de taberna — carbón y hueso, cobre del alambique como acento, verde agave para lo que da soporte; pasos arriba, trabajo al centro. */
:root{
  --bg:#141210;--surface:#1C1916;--raised:#26221E;--line:#3A342E;--fg:#EFE8DC;--muted:#A99F92;
  --copper:#C57B45;--copper-soft:rgba(197,123,69,.16);--agave:#93A89E;--focus:#E3A873;
  --ok:#86B592;--mid:#D8B460;--danger:#E58A70;--ok-soft:rgba(134,181,146,.2);--danger-soft:rgba(229,138,112,.2);
  --t-est-bg:#EFE8DC;--t-est-fg:#1A1714;--t-op-bg:#C57B45;--t-op-fg:#1B1310;--t-ap-bg:#93A89E;--t-ap-fg:#13201B;
  --side-bg:#2E2925;--side-fg:#EFE8DC;
  --display:'Montserrat','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F2EDE4;--surface:#FBF8F2;--raised:#EDE6DA;--line:#DBD1C2;--fg:#1C1916;--muted:#6A6157;
  --copper:#A65A27;--copper-soft:rgba(166,90,39,.12);--agave:#5E766B;--focus:#A65A27;
  --ok:#3F8A55;--mid:#B88A1E;--danger:#B4472D;--ok-soft:rgba(63,138,85,.14);--danger-soft:rgba(180,71,45,.13);
  --t-est-bg:#1C1916;--t-est-fg:#EFE8DC;--t-op-bg:#C57B45;--t-op-fg:#1B1310;--t-ap-bg:#A9BBB2;--t-ap-fg:#13201B;
  --side-bg:#2E2925;--side-fg:#EFE8DC;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2EDE4;--surface:#FBF8F2;--raised:#EDE6DA;--line:#DBD1C2;--fg:#1C1916;--muted:#6A6157;
  --copper:#A65A27;--copper-soft:rgba(166,90,39,.12);--agave:#5E766B;--focus:#A65A27;
  --ok:#3F8A55;--mid:#B88A1E;--danger:#B4472D;--ok-soft:rgba(63,138,85,.14);--danger-soft:rgba(180,71,45,.13);
  --t-est-bg:#1C1916;--t-est-fg:#EFE8DC;--t-op-bg:#C57B45;--t-op-fg:#1B1310;--t-ap-bg:#A9BBB2;--t-ap-fg:#13201B;
  --side-bg:#2E2925;--side-fg:#EFE8DC;color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{text-wrap:balance}
/* header */
header.top{border-bottom:1px solid var(--line);padding-block:18px}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.mark{position:relative;display:inline-flex;align-items:center;min-height:44px}
.mark .logo{display:block;height:58px;aspect-ratio:640/365;background:var(--fg);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.mark img{max-height:44px;max-width:180px;display:block}
.ttl{display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:18px}
.ttl b{font-size:15px;font-weight:700}
.ttl span{font-size:13.5px;color:var(--muted)}
.hact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#1B1310}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ico{border:0;background:transparent;width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:15px;display:grid;place-items:center;flex:none}
.ico:hover:not(:disabled){background:var(--raised);color:var(--fg)}
.ico:disabled{opacity:.3;cursor:default}
/* barra de datos */
.databar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.databar .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.databar .sp{flex:1}
/* pasos */
.steps{display:flex;gap:4px;margin:22px 0 18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);font-weight:600;font-size:15px}
.step .n{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--raised);color:var(--fg);font-family:var(--mono);font-size:13px}
.step[aria-current="step"]{background:var(--surface);border-color:var(--line);color:var(--fg)}
.step[aria-current="step"] .n{background:var(--copper);color:#1B1310}
main{padding-bottom:56px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px}
.panel h1{font-family:var(--display);font-weight:800;letter-spacing:-.015em;font-size:32px;line-height:1.15;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px;max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:700;font-size:14.5px}
.help{font-size:13px;color:var(--muted)}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg)}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px var(--copper-soft)}
.tip{display:flex;gap:12px;align-items:flex-start;border-left:3px solid var(--copper);background:var(--copper-soft);border-radius:0 10px 10px 0;padding:12px 16px;margin-top:22px;font-size:14.5px;max-width:90ch}
.tip b{font-weight:700}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.sec{margin:22px 0 10px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{color:var(--muted);font-size:14px;font-style:italic}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;font-weight:600;background:var(--raised)}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%}
.chip button:hover{background:var(--line);color:var(--fg)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.logobox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.logobox img{max-height:44px;max-width:180px;background:#fff;border-radius:6px;padding:4px}
/* procesos */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.type{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg);min-width:0}
.type h2{margin:0;font-size:17px;display:flex;align-items:center;gap:10px;font-weight:700}
.type h2 .dot{width:14px;height:14px;border-radius:3px;flex:none}
.type p{margin:0;color:var(--muted);font-size:13.5px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.plist li .nm{grid-column:1/2}
.plist li .ctl{display:flex;grid-row:1/3;grid-column:2/3;flex-direction:column}
.plist li input{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px}
.plist li input:focus{background:var(--bg);border-color:var(--focus)}
.plist li .nm input{font-weight:700}
.plist li .rs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding-left:6px}
.plist li .rs input{font-size:13.5px;color:var(--fg)}
/* caracterización y actividades */
.carlayout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}
.plnav{display:flex;flex-direction:column;gap:2px;max-height:72vh;overflow:auto;padding-right:4px;min-width:0}
.plnav .grp{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.plnav button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 9px;cursor:pointer;font-weight:600;font-size:14.5px}
.plnav button[aria-current="true"]{background:var(--raised);border-color:var(--line)}
.plnav .st{flex:none;width:11px;height:11px;border-radius:50%;border:2px solid var(--line)}
.plnav .st.ok{background:var(--ok);border-color:var(--ok)}
.plnav .st.mid{background:var(--mid);border-color:var(--mid)}
.plnav .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--raised);border-radius:6px;padding:1px 7px}
.carform{min-width:0}
.carform h2{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.015em;font-size:26px}
.sub{color:var(--muted);margin:2px 0 14px;font-size:14px}
/* actividades */
.acts{display:flex;flex-direction:column;gap:10px;counter-reset:act}
.act{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 12px 12px 14px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px}
.act .num{font-family:var(--mono);font-size:13px;color:var(--copper);padding-top:9px}
.act .ag{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px;min-width:0}
.act .ag .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.act .ag .f label{font-size:12px;font-weight:700;color:var(--muted)}
.act .ag .f.c6{grid-column:span 6}.act .ag .f.c4{grid-column:span 4}.act .ag .f.c3{grid-column:span 3}.act .ag .f.c2{grid-column:span 2}
.act .ctl{display:flex;flex-direction:column}
.addact{display:flex;gap:8px;margin-top:12px}
.addact input{flex:1;min-width:0}
/* mapa */
.mapwrap{overflow-x:auto}
.map{min-width:820px;display:grid;grid-template-columns:140px minmax(0,1fr) 140px;gap:12px;align-items:stretch}
.side{background:var(--side-bg);color:var(--side-fg);border-radius:12px;padding:16px 12px;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:center}
.side b{font-family:var(--display);font-weight:800;letter-spacing:-.015em;font-size:17px}
.side span{font-size:13px;opacity:.85;line-height:1.35}
.bands{display:flex;flex-direction:column;gap:10px}
.band{border-radius:12px;padding:12px 14px;background:var(--raised);display:flex;flex-direction:column;gap:10px}
.band .bl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.band .bl i{width:11px;height:11px;border-radius:3px;display:block}
.tiles{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.tiles.flow{gap:16px}
.tiles.flow .tile:not(:last-child)::after{content:"";position:absolute;right:-13px;top:50%;border-left:8px solid var(--copper);border-top:6px solid transparent;border-bottom:6px solid transparent;transform:translateY(-50%)}
.tile{position:relative;flex:1 1 120px;min-height:70px;border:0;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.25;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}
.tile small{font-weight:600;font-size:11.5px;opacity:.8;font-family:var(--mono)}
.t-estrategico{background:var(--t-est-bg);color:var(--t-est-fg)}
.t-operativo{background:var(--t-op-bg);color:var(--t-op-fg)}
.t-apoyo{background:var(--t-ap-bg);color:var(--t-ap-fg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:14px}
.banner b{color:var(--copper)}
/* ficha */
.turtle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tb{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);min-height:100px;min-width:0}
.tb h3{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tb ul{margin:0;padding-left:18px;font-size:14px}
.tb p{margin:0;font-size:14px}
.tb .none{color:var(--muted);font-style:italic;font-size:13.5px}
.tb.center{border:0;display:flex;flex-direction:column;gap:6px}
.tb.center h3{color:inherit;opacity:.75}
.tb.center.t-estrategico{background:var(--t-est-bg);color:var(--t-est-fg)}.tb.center.t-operativo{background:var(--t-op-bg);color:var(--t-op-fg)}.tb.center.t-apoyo{background:var(--t-ap-bg);color:var(--t-ap-fg)}
.tb.center .pn{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15}
.carhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.carfoot{margin-top:10px}
/* tablas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--raised);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.filters select{width:auto;min-width:180px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0 6px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.stat b{display:block;font-family:var(--display);font-weight:800;letter-spacing:-.015em;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
/* resultados */
.restable{min-width:1100px}
.restable th.mh{text-align:center;padding-inline:4px}
.restable td.m{padding:5px 3px}
.restable td.m input{width:100%;min-width:52px;padding:6px 5px;text-align:right;font-family:var(--mono);font-size:13px;background:transparent;border:1px solid var(--line);border-radius:6px}
.restable td.m.ok input{background:var(--ok-soft);border-color:var(--ok)}
.restable td.m.miss input{background:var(--danger-soft);border-color:var(--danger)}
.restable .stk{position:sticky;left:0;z-index:1;background:var(--surface);min-width:220px;max-width:280px;box-shadow:1px 0 0 var(--line)}
.restable th.stk{background:var(--raised)}
.restable .stk b{display:block;font-weight:700;font-size:13.5px;line-height:1.3}
.restable .stk small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.restable tr.grp td{background:var(--raised);font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-block:7px}
.restable tr.grp td.stk{background:var(--raised)}
.restable td.meta{font-family:var(--mono);font-size:13px;white-space:nowrap}
.reslegend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 0;font-size:13px;color:var(--muted)}
.reslegend span{display:flex;align-items:center;gap:7px}
.reslegend i{width:14px;height:14px;border-radius:4px;display:block;border:1px solid var(--line)}
.reslegend i.ok{background:var(--ok-soft);border-color:var(--ok)}.reslegend i.miss{background:var(--danger-soft);border-color:var(--danger)}
/* modal y aviso */
.overlay{position:fixed;inset:0;background:rgba(10,9,8,.6);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:24px}
.dlg h2{font-family:var(--display);font-weight:800;letter-spacing:-.015em;margin:0 0 8px;font-size:22px}
.dlg p{margin:0 0 6px;color:var(--muted)}
.dlg .opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.dlg .opts .btn{justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px}
.dlg .opts .btn small{font-weight:500;color:var(--muted);font-size:13px}
.dlg .opts .btn.primary small{color:#3A2416}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:12px;align-items:center;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--copper);font-weight:800;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer.foot{border-top:1px solid var(--line);padding-block:16px;font-size:13px;color:var(--muted)}
@media (max-width:900px){.types{grid-template-columns:1fr}.carlayout{grid-template-columns:1fr}.plnav{max-height:none;flex-direction:row;flex-wrap:wrap}.plnav .grp{width:100%}.plnav .cnt{margin-left:4px}}
@media (max-width:720px){.grid2{grid-template-columns:1fr}.panel{padding:20px}.turtle{grid-template-columns:1fr}.act .ag{grid-template-columns:1fr 1fr}.act .ag .f.c6,.act .ag .f.c4,.act .ag .f.c3{grid-column:span 2}.act .ag .f.c2{grid-column:span 1}.restable .stk{min-width:150px;max-width:170px}.ttl{border-left:0;padding-left:0}.hact{margin-left:0}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="mark" id="mark"><span class="logo" role="img" aria-label="Raicilla Perra Suerte"></span></div>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p||"x")+Math.random().toString(36).slice(2,9);
const lines=s=>String(s||"").split(/\n+/).map(x=>x.replace(/^\s*[•\-\*·]\s*/,"").trim()).filter(Boolean);
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const typeOf=id=>TYPES.find(t=>t.id===id)||TYPES[1];
const today=()=>new Date().toISOString().slice(0,10);
const pad2=n=>String(n).padStart(2,"0");
function num(v){let t=String(v??"").trim().replace(/%/g,"").replace(/\s/g,"");if(!t)return NaN;if(t.includes(",")&&!t.includes("."))t=t.replace(",",".");else t=t.replace(/,/g,"");return /^-?\d*\.?\d+$/.test(t)?parseFloat(t):NaN}
function parseMeta(m){const r=String(m||"").trim().match(/^(≥|>=|≤|<=|>|<|=|m[aá]x(?:imo)?|m[ií]n(?:imo)?)?\s*(-?[\d.,]+)\s*%?/i);if(!r)return null;const n=num(r[2]);if(isNaN(n))return null;let op=(r[1]||"≥").toLowerCase();if(op===">="||/^m[ií]n/.test(op))op="≥";if(op==="<="||/^m[aá]x/.test(op))op="≤";return {op,n}}
function evalRes(meta,v){const m=parseMeta(meta),x=num(v);if(!m||isNaN(x))return "";const ok={"≥":x>=m.n,">":x>m.n,"≤":x<=m.n,"<":x<m.n,"=":x===m.n}[m.op];return ok?"ok":"miss"}
function hrs(a){const n=num(a.horas);return isNaN(n)?0:n}
const fmtH=n=>String(Math.round(n*10)/10);
function parseMes(v){if(v instanceof Date){const d=new Date(v.getTime()+432e5);return d.getFullYear()+"-"+pad2(d.getMonth()+1)}const s=norm(v);let m=s.match(/^(\d{4}) (\d{1,2})( \d{1,2})?$/);if(m&&+m[2]>=1&&+m[2]<=12)return m[1]+"-"+pad2(m[2]);m=s.match(/^(\d{1,2}) (\d{4})$/);if(m&&+m[1]>=1&&+m[1]<=12)return m[2]+"-"+pad2(m[1]);m=s.match(/^([a-z]+) (?:de )?(\d{4})$/);if(m){const i=MESES_L.findIndex(x=>x.slice(0,3)===m[1].slice(0,3));if(i>=0)return m[2]+"-"+pad2(i+1)}return ""}
function cumple(a,y){let n=0,ok=0;for(let i=1;i<=12;i++){const r=evalRes(a.meta,a.resultados[y+"-"+pad2(i)]);if(r){n++;if(r==="ok")ok++}}return {n,ok}}
let toastT=null;
function toast(msg,actLabel,act){const t=$("#toast"),b=$("#toastAct");$("#toastMsg").textContent=msg;if(actLabel){b.hidden=false;b.textContent=actLabel;b.onclick=()=>{t.classList.remove("show");act()}}else b.hidden=true;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),actLabel?6000:3200)}
function modal({title,text,options}){return new Promise(res=>{const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">${esc(title)}</h2>${(Array.isArray(text)?text:[text]).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("")}<div class="opts">${options.map((o,i)=>`<button class="btn ${o.primary?"primary":""} ${o.danger?"danger":""}" type="button" data-i="${i}">${esc(o.label)}${o.desc?`<small>${esc(o.desc)}</small>`:""}</button>`).join("")}<button class="btn ghost" type="button" data-i="-1">Cancelar</button></div></div>`;
  const close=v=>{ov.remove();document.removeEventListener("keydown",kd);res(v)};const kd=e=>{if(e.key==="Escape")close(null)};
  ov.addEventListener("click",e=>{if(e.target===ov)close(null);const b=e.target.closest("button[data-i]");if(b){const i=+b.dataset.i;close(i<0?null:options[i].value)}});
  document.addEventListener("keydown",kd);document.body.appendChild(ov);ov.querySelector("button").focus()})}

    actividades:(Array.isArray(p.actividades)?p.actividades:[]).filter(a=>a&&a.actividad).map(a=>({id:a.id||uid("a"),actividad:String(a.actividad),responsable:String(a.responsable||""),frecuencia:String(a.frecuencia||""),horas:String(a.horas??""),entregable:String(a.entregable||""),herramienta:String(a.herramienta||""),indicador:String(a.indicador||""),meta:String(a.meta||""),notas:String(a.notas||""),
      resultados:Object.fromEntries(Object.entries(a.resultados&&typeof a.resultados==="object"?a.resultados:{}).filter(([k,v])=>/^\d{4}-\d{2}$/.test(k)&&String(v??"").trim()!=="").map(([k,v])=>[k,String(v)]))}))}));
  return s}
const procsOf=t=>S.procesos.filter(p=>p.tipo===t);
const ordered=()=>TYPES.flatMap(t=>procsOf(t.id));
function status(p){const c=p.car;const req=["objetivo","entradas","salidas"];const n=req.filter(k=>(c[k]||"").trim()).length+(p.resp.trim()?1:0);const any=CAR_KEYS.some(k=>(c[k]||"").trim());return n===4?"ok":(any||p.resp)?"mid":""}
function equipoAll(){const set=new Set(S.equipo);S.procesos.forEach(p=>{if(p.resp)set.add(p.resp);if(p.resp2)set.add(p.resp2);p.actividades.forEach(a=>a.responsable&&set.add(a.responsable))});return [...set]}
function datalists(){return `<datalist id="dlEquipo">${equipoAll().map(n=>`<option value="${esc(n)}">`).join("")}</datalist><datalist id="dlFreq">${FREQ.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`}

function renderMark(){const m=$("#mark");if(S.empresa.logo){m.innerHTML=`<img src="${S.empresa.logo}" alt="Logo">`}else if(!m.querySelector(".logo")){m.innerHTML=`<span class="logo" role="img" aria-label="Raicilla Perra Suerte"></span>`}}

/* ---------- 1. empresa y equipo ---------- */

/* ---------- 2. procesos ---------- */

    if(!v)return;if(v==="replace"){const keep={...S.empresa};S=base();S.empresa=Object.assign(S.empresa,{logo:keep.logo,logoW:keep.logoW,logoH:keep.logoH,elaboro:keep.elaboro});toast("Mapa base cargado.")}else{const r=mergeData(base());toast(`Se agregaron ${r.p} procesos.`)}save();vProcesos()};

function drawList(t){
  const ul=$("#list-"+t),ps=procsOf(t);
  ul.innerHTML=ps.length?ps.map((p,i)=>`<li data-id="${p.id}"><div class="nm"><label class="sr" for="n-${p.id}">Nombre</label><input type="text" id="n-${p.id}" value="${esc(p.nombre)}"></div>
   <div class="ctl"><button class="ico" type="button" data-a="up" aria-label="Subir" ${i===0?"disabled":""}>↑</button><button class="ico" type="button" data-a="down" aria-label="Bajar" ${i===ps.length-1?"disabled":""}>↓</button></div>
   <div class="rs"><label for="r-${p.id}">Responsable</label><input type="text" id="r-${p.id}" list="dlEquipo" value="${esc(p.resp)}" placeholder="Sin asignar"><select aria-label="Mover a" data-a="mv" style="width:auto;padding:3px 6px;font-size:12.5px">${TYPES.map(x=>`<option value="${x.id}" ${x.id===t?"selected":""}>${x.label}</option>`).join("")}</select><button class="ico" type="button" data-a="del" aria-label="Eliminar">✕</button></div></li>`).join(""):`<li class="empty" style="display:block;background:transparent;border:0;padding:0">Sin procesos todavía.</li>`;
  ul.querySelectorAll("li[data-id]").forEach(li=>{const p=S.procesos.find(x=>x.id===li.dataset.id);
    li.querySelector(`#n-${p.id}`).oninput=e=>{p.nombre=e.target.value;save()};
    li.querySelector(`#r-${p.id}`).oninput=e=>{p.resp=e.target.value;save()};
    li.querySelector("select").onchange=e=>{const arr=S.procesos;arr.splice(arr.indexOf(p),1);p.tipo=e.target.value;arr.push(p);save();drawList(t);drawList(p.tipo)};
    li.querySelectorAll("button").forEach(b=>b.onclick=async()=>{const a=b.dataset.a,arr=S.procesos,idx=arr.indexOf(p);
      if(a==="del"){const n=p.actividades.length;const v=await modal({title:`Eliminar “${p.nombre}”`,text:n?`También se eliminan su ficha y sus ${n} actividades.`:"También se elimina su ficha.",options:[{label:"Eliminar proceso",value:true,danger:true}]});if(!v)return;arr.splice(arr.indexOf(p),1);if(selected===p.id)selected=null}
      else{const same=arr.filter(x=>x.tipo===t);const j=same.indexOf(p)+(a==="up"?-1:1);const k=arr.indexOf(same[j]);[arr[idx],arr[k]]=[arr[k],arr[idx]]}
      save();drawList(t)})});
}

/* ---------- 3. fichas ---------- */
function procNav(mode){return TYPES.map(tt=>{const ps=procsOf(tt.id);return ps.length?`<div class="grp">${tt.label}</div>`+ps.map(q=>`<button type="button" data-id="${q.id}" ${q.id===selected?'aria-current="true"':''}>${mode==="act"?"":`<span class="st ${status(q)}" aria-hidden="true"></span>`}${esc(q.nombre)}${mode==="act"?`<span class="cnt">${q.actividades.length}</span>`:""}</button>`).join(""):""}).join("")}
function ensureSel(){if(!selected||!S.procesos.find(p=>p.id===selected))selected=ordered()[0].id;return S.procesos.find(p=>p.id===selected)}

  if(!S.procesos.length){go(1);return}

function mergeData(inc){
  inc=sanitize(JSON.parse(JSON.stringify(inc)));const r={p:0,a:0,c:0};
  Object.entries(inc.empresa).forEach(([k,v])=>{if(k==="logo"||k==="logoW"||k==="logoH"){if(v&&!S.empresa.logo)S.empresa[k]=v;return}if(v&&!String(S.empresa[k]||"").trim())S.empresa[k]=v});
  inc.equipo.forEach(n=>{if(!S.equipo.some(x=>norm(x)===norm(n)))S.equipo.push(n)});
  inc.procesos.forEach(ip=>{let p=S.procesos.find(x=>norm(x.nombre)===norm(ip.nombre));
    if(!p){p={...ip,id:uid("p"),actividades:[]};S.procesos.push(p);r.p++}
    else{if(!p.resp&&ip.resp){p.resp=ip.resp;r.c++}if(!p.resp2&&ip.resp2){p.resp2=ip.resp2;r.c++}
      CAR_KEYS.forEach(k=>{const cur=p.car[k]||"",nv=ip.car[k]||"";if(!nv.trim())return;if(!cur.trim()){p.car[k]=nv;r.c++;return}
        const have=new Set(lines(cur).map(norm));const add=lines(nv).filter(l=>!have.has(norm(l)));if(add.length){p.car[k]=cur.replace(/\s+$/,"")+"\n"+add.join("\n");r.c++}})}
    ip.actividades.forEach(ia=>{const a=p.actividades.find(x=>norm(x.actividad)===norm(ia.actividad));
      if(!a){p.actividades.push({...ia,id:uid("a")});r.a++}
      else{["responsable","frecuencia","horas","entregable","herramienta","indicador","meta","notas"].forEach(k=>{if(!a[k]&&ia[k]){a[k]=ia[k];r.c++}});Object.entries(ia.resultados||{}).forEach(([k,v])=>{if(!a.resultados[k]){a.resultados[k]=v;r.c++}})}})});
  return r}
async function askMode(what){return modal({title:`Cargar ${what}`,text:"Elige qué hacer con lo que ya tienes capturado.",options:[{label:"Combinar con lo actual",desc:"Agrega procesos y actividades nuevos y completa campos vacíos. No borra nada.",value:"merge",primary:true},{label:"Reemplazar todo",desc:"Lo actual se sustituye por el archivo.",value:"replace",danger:true}]})}
function applyIncoming(inc,mode,what){
  if(mode==="replace"){const lg=S.empresa.logo?{logo:S.empresa.logo,logoW:S.empresa.logoW,logoH:S.empresa.logoH}:{};const n=sanitize(inc);n.empresa=what==="Excel"?{...S.empresa}:Object.assign({},lg,n.empresa);if(what==="Excel")S.equipo.forEach(x=>{if(!n.equipo.includes(x))n.equipo.push(x)});S=n;selected=null;viewProc=null;save();render();
    toast(`${what} cargado: ${S.procesos.length} procesos y ${allActs().length} actividades.`)}
  else{const r=mergeData(inc);S.base=false;save();render();toast(`Se agregaron ${r.p} procesos y ${r.a} actividades; se completaron ${r.c} campos.`)}
}

async function offer(name,data,what){
  const dl=dlP?await dlP:null;
  if(dl){try{const r=await dl.save({filename:name,data});if(r.status==="saved")toast(`${what} listo.`)}catch(err){if(err&&err.code==="declined")return;if(err&&err.code==="rate_limited"){toast("Ya hay una descarga pendiente. Confírmala o espera un momento.");return}toast(`No se pudo descargar el ${what}.`)}return}
  try{const blob=data instanceof Blob?data:new Blob([data],{type:"application/octet-stream"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(`${what} listo.`)}catch(e){toast("La descarga no está disponible aquí.")}
}
